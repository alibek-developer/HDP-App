<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>HDP Academy — dars</title>
<style>
  html,body{margin:0;padding:0;background:#0E1A12;overflow:hidden}
  #p{position:fixed;left:0;top:0;width:100%;height:100%}
</style>
</head>
<body>
<div id="p"></div>
<script>
  var params = new URLSearchParams(location.search);
  var videoId = params.get('v') || '';
  var valid = /^[A-Za-z0-9_-]{6,20}$/.test(videoId);
  var API = 'https://www.youtube.com/iframe_api';

  function send(m) {
    try { window.ReactNativeWebView.postMessage(JSON.stringify(m)); } catch (e) {}
  }

  var player = null, pos = 0, credit = 0, iv = null, lastAt = 0, jumped = false;

  function poll() {
    if (iv) return;
    lastAt = Date.now();
    iv = setInterval(function () {
      try {
        if (!player || !player.getCurrentTime) return;
        var d = player.getDuration() || 0, t = player.getCurrentTime() || 0;
        if (!d) return;
        var now = Date.now(), wall = (now - lastAt) / 1000;
        lastAt = now;
        var step = t - pos;
        pos = t;
        /* Faqat tabiiy oqim: oldinga surish ko'rilgan vaqtga qo'shilmaydi */
        if (step > 0) {
          if (step <= wall + 5) credit += step;
          else jumped = true;
        }
        send({ type: 'time', t: credit, d: d });
      } catch (e) {}
    }, 500);
  }

  function stop() {
    if (iv) { clearInterval(iv); iv = null; }
  }

  window.onYouTubeIframeAPIReady = function () {
    if (!valid) { send({ type: 'error', code: 2 }); return; }
    player = new YT.Player('p', {
      videoId: videoId,
      playerVars: {
        rel: 0, modestbranding: 1, playsinline: 1, iv_load_policy: 3,
        controls: 1, autoplay: 0, enablejsapi: 1, origin: location.origin
      },
      events: {
        onReady: function () { send({ type: 'ready' }); },
        onError: function (e) { send({ type: 'error', code: e && e.data }); },
        onStateChange: function (e) {
          if (e.data === YT.PlayerState.PLAYING) { poll(); return; }
          stop();
          /* Oxirigacha ko'rildi — sakrash bo'lmagan bo'lsa, hammasi ko'rilgan */
          if (e.data === YT.PlayerState.ENDED) {
            var d = (player && player.getDuration && player.getDuration()) || 0;
            if (d) send({ type: 'time', t: jumped ? credit : d, d: d });
          }
        }
      }
    });
  };

  (function () {
    var s = document.createElement('script');
    s.src = API;
    s.onerror = function () { send({ type: 'error', code: 0 }); };
    document.head.appendChild(s);
  })();
</script>
</body>
</html>
